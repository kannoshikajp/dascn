spring.application.name=joppe-backend

# Datasource configuration (override via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/joppe_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Security
jwt.secret=${JWT_SECRET:joppe-super-secret-jwt-key-with-minimum-256-bits-length-required-by-hmac-sha256}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Default Admin Account (auto-created on startup if not present)
app.admin.auto-create=${APP_ADMIN_AUTO_CREATE:true}
app.admin.email=${APP_ADMIN_EMAIL:admin@joppe.vn}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123456}
app.admin.full-name=${APP_ADMIN_FULL_NAME:System Administrator}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8888,http://localhost:3000,http://127.0.0.1:8888,http://127.0.0.1:3000}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Media Upload / Static Assets
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}





