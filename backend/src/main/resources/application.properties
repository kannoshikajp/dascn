spring.application.name=joppe-backend

# Datasource configuration (override via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/joppe}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:joppe_db_account}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:joppe}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Security
jwt.secret=${JWT_SECRET:joppe-super-secret-jwt-key-with-minimum-256-bits-length-required-by-hmac-sha256}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Default Admin Account (auto-created on startup if not present)
app.admin.auto-create=${APP_ADMIN_AUTO_CREATE:true}
app.admin.email=${APP_ADMIN_EMAIL:admin@joppe.vn}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123456}
app.admin.full-name=${APP_ADMIN_FULL_NAME:System Administrator}

# Domain & Server Base URL Configuration
app.domain=${APP_DOMAIN:joppe.penguinlab.org}
app.base-url=${APP_BASE_URL:https://joppe.penguinlab.org}
app.frontend-url=${APP_FRONTEND_URL:https://joppe-dash.vercel.app}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8888,http://localhost:3000,http://127.0.0.1:8888,http://127.0.0.1:3000,https://joppe-dash.vercel.app,https://joppe-dashboard.vercel.app,https://joppe.penguinlab.org}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app,https://*.penguinlab.org}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Media Upload / Static Assets
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Mail Configuration (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

# Application Mail Sender Defaults
app.mail.from=${APP_MAIL_FROM:noreply@joppe.vn}
app.mail.from-name=${APP_MAIL_FROM_NAME:Joppe Tech Store}

# VNPay Gateway Configuration (Sandbox)
joppe.vnpay.tmn-code=${VNPAY_TMN_CODE:H04KMMWQ}
joppe.vnpay.hash-secret=${VNPAY_HASH_SECRET:QSRCXQVXSJPTZJDSAPEKSGMMUEPBOGSA}
joppe.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
joppe.vnpay.return-url=${VNPAY_RETURN_URL:${app.base-url}/api/v1/payment/vnpay/return}
joppe.vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

